name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: XCTest
        run: swift test --enable-xctest --disable-swift-testing
      - name: Native app package smoke test
        run: ./Scripts/build-app.sh release native
      - name: Verify app signature
        run: codesign --verify --deep --strict CodexPulse.app
