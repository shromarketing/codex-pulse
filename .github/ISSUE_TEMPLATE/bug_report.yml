name: Bug report
description: Report a reproducible Codex Pulse problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Codex Pulse. Remove account emails, project names, prompts, cookies and tokens before submitting.
  - type: input
    id: version
    attributes:
      label: Codex Pulse version
      placeholder: "0.5.0 (29)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and Mac
      placeholder: "macOS 15.6, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Dashboard
        - Menu bar
        - Floating widget
        - Settings
        - Codex connection
        - Claude Web connector
        - Task router
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use sanitized sample data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, emails, prompts, chats and private project names.
          required: true
